name: NoirStay verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test bootJar --no-daemon
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-results, path: backend/build/reports/tests}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.12.0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build
        working-directory: frontend
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.12.0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: cp .env.example .env && docker compose up --build -d --wait
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: frontend/playwright-report}
      - run: docker compose logs --no-color && docker compose down
        if: always()
