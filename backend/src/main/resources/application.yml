server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: noirstay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/noirstay}
    username: ${DATABASE_USER:noirstay}
    password: ${DATABASE_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
noirstay:
  demo: false
  demo-contexts-per-hour: ${DEMO_CONTEXTS_PER_HOUR:10}
  media-root: ${MEDIA_ROOT:./.runtime/media}
  reference-date: ${DEMO_REFERENCE_DATE:}
